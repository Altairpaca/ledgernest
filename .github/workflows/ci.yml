name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"
          if printf '%s\n' "$tracked" | grep -Eq '(^|/)(\.omo|\.opencode|\.codegraph)(/|$)|(^|/)\.env$|^db\.sqlite3$|\.sqlite3-(wal|shm|journal)$|^media/'; then
            echo "Forbidden local/runtime state is tracked:" >&2
            printf '%s\n' "$tracked" | grep -E '(^|/)(\.omo|\.opencode|\.codegraph)(/|$)|(^|/)\.env$|^db\.sqlite3$|\.sqlite3-(wal|shm|journal)$|^media/' >&2
            exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is a hash-locked production export. Keep test tooling
          # in a separate pip invocation so pip's --require-hashes mode does not
          # incorrectly apply to the ad-hoc test requirements.
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-django
      - name: Django checks
        run: python manage.py check --settings=config.settings_test
      - name: Tests
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q accounts audit config core imports_exports ledgers reports transactions tests
      - name: Whitespace check
        run: git diff --check
