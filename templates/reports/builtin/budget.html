{% extends "reports/_report_base.html" %}
{% block report_params %}
<form method="get" class="mb-3 grid grid-cols-2 gap-2">
  <select name="year" class="form-select !min-h-[40px] !py-1.5 text-sm" onchange="this.form.submit()">
    {% for y in year_range %}<option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}</option>{% endfor %}
  </select>
  <select name="month" class="form-select !min-h-[40px] !py-1.5 text-sm" onchange="this.form.submit()">
    {% for m in month_range %}<option value="{{ m }}" {% if m == month %}selected{% endif %}>{{ m }} 月</option>{% endfor %}
  </select>
</form>
{% endblock %}
{% block report_table %}
<div class="card overflow-hidden">
  <div class="divide-y divide-gray-100 dark:divide-gray-800">
    {% for r in rows %}
    <div class="flex items-center gap-3 px-4 py-3">
      <div class="min-w-0 flex-1">
        <div class="text-sm font-medium">{{ r.label }}</div>
        <div class="mt-1 h-2 overflow-hidden rounded-full bg-gray-100 dark:bg-gray-800">
          <div class="h-full rounded-full {% if r.percent > 100 %}bg-red-500{% elif r.percent > 80 %}bg-amber-500{% else %}bg-brand-500{% endif %}" style="width: {{ r.percent|floatformat:1 }}%"></div>
        </div>
      </div>
      <div class="text-right text-sm">
        <div class="{% if r.percent > 100 %}text-red-500{% endif %}">{{ r.spent }} / {{ r.amount }}</div>
        <div class="text-xs text-gray-400">{{ r.percent|floatformat:0 }}%</div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
{% block export_links %}
<a class="btn-secondary text-sm" href="{% url 'imports:export_report' ledger.pk %}?format=csv&report_key=budget&year={{ year }}&month={{ month }}">导出 CSV</a>
<a class="btn-secondary text-sm" href="{% url 'imports:export_report' ledger.pk %}?format=xlsx&report_key=budget&year={{ year }}&month={{ month }}">导出 XLSX</a>
{% endblock %}
