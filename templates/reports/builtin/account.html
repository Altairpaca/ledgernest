{% extends "reports/_report_base.html" %}
{% block report_params %}
<form method="get" class="mb-3 grid grid-cols-2 gap-2">
  <input type="date" name="start" class="form-input !min-h-[40px] !py-1.5 text-sm" value="{{ start|date:'Y-m-d' }}">
  <input type="date" name="end" class="form-input !min-h-[40px] !py-1.5 text-sm" value="{{ end|date:'Y-m-d' }}">
</form>
{% endblock %}
{% block report_table %}
<div class="card overflow-hidden">
  <div class="divide-y divide-gray-100 dark:divide-gray-800">
    {% for r in rows %}
    <div class="grid grid-cols-4 px-4 py-2.5 text-sm">
      <span class="flex items-center gap-1.5 text-gray-600 dark:text-gray-300"><span class="truncate">{{ r.account.name }}</span>{% if not r.account.is_active %}<span class="badge bg-gray-100 text-gray-400">停用</span>{% endif %}</span>
      <span class="text-right text-green-600 dark:text-green-400">{{ r.inflow }}</span>
      <span class="text-right text-red-500">{{ r.outflow }}</span>
      <span class="text-right font-medium {% if r.balance < 0 %}text-red-500{% endif %}">{{ r.balance }}</span>
    </div>
    {% endfor %}
  </div>
  <div class="grid grid-cols-4 border-t border-gray-200 bg-gray-50 px-4 py-2 text-xs font-medium text-gray-400 dark:border-gray-800 dark:bg-gray-800/50">
    <span>账户</span><span class="text-right">流入</span><span class="text-right">流出</span><span class="text-right">期末余额</span>
  </div>
</div>
{% endblock %}
