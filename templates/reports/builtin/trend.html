{% extends "reports/_report_base.html" %}
{% block report_params %}
<form method="get" class="mb-3 flex gap-2">
  <select name="months" class="form-select !min-h-[40px] !py-1.5 text-sm w-32" onchange="this.form.submit()">
    <option value="3" {% if params.months == 3 %}selected{% endif %}>近 3 个月</option>
    <option value="6" {% if params.months == 6 %}selected{% endif %}>近 6 个月</option>
    <option value="12" {% if params.months == 12 %}selected{% endif %}>近 12 个月</option>
  </select>
</form>
{% endblock %}
{% block report_table %}
<div class="card overflow-hidden">
  <div class="divide-y divide-gray-100 dark:divide-gray-800">
    {% for r in rows %}
    <div class="grid grid-cols-4 px-4 py-2.5 text-sm">
      <span class="text-gray-500">{{ r.label }}</span>
      <span class="text-right text-green-600 dark:text-green-400">{{ r.income }}</span>
      <span class="text-right text-red-500">{{ r.expense }}</span>
      <span class="text-right font-medium {% if r.net < 0 %}text-red-500{% else %}text-gray-700 dark:text-gray-200{% endif %}">{{ r.net }}</span>
    </div>
    {% endfor %}
  </div>
  <div class="grid grid-cols-4 border-t border-gray-200 bg-gray-50 px-4 py-2 text-xs font-medium text-gray-400 dark:border-gray-800 dark:bg-gray-800/50">
    <span>月份</span><span class="text-right">收入</span><span class="text-right">支出</span><span class="text-right">净额</span>
  </div>
</div>
{% endblock %}
{% block export_links %}
{{ block.super }}
{% endblock %}
