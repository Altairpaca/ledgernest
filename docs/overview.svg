<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">LedgerNest accounting semantics and system boundaries</title>
  <desc id="desc">Diagram showing transaction semantics, shared accounting services, collaborative ledger isolation, reporting and audit outputs.</desc>
  <rect width="1100" height="420" rx="24" fill="#fbfaf6"/>
  <text x="52" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#18212b">LedgerNest · one accounting truth across every surface</text>
  <text x="52" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" fill="#66717e">Balances, reports, exports, budgets, and audit events reuse the same explicit transaction semantics.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <g>
      <rect x="54" y="118" width="250" height="70" rx="13" fill="#eef2f5" stroke="#c9d3da"/>
      <text x="76" y="146" font-size="14" font-weight="700" fill="#234b63">Transaction semantics</text>
      <text x="76" y="168" font-size="11.5" fill="#62717d">expense · income · transfer · adjustment</text>
      <text x="76" y="183" font-size="11.5" fill="#62717d">refund · reimbursement · splits · FX</text>
    </g>
    <g>
      <rect x="54" y="214" width="250" height="70" rx="13" fill="#edf3f0" stroke="#cbd8d4"/>
      <text x="76" y="242" font-size="14" font-weight="700" fill="#3f665e">Isolation &amp; permissions</text>
      <text x="76" y="264" font-size="11.5" fill="#62716d">owner / admin / editor / viewer</text>
      <text x="76" y="279" font-size="11.5" fill="#62716d">cross-ledger references fail closed</text>
    </g>
    <g>
      <rect x="54" y="310" width="250" height="70" rx="13" fill="#f5efe7" stroke="#ddcfbd"/>
      <text x="76" y="338" font-size="14" font-weight="700" fill="#7d5d3a">Import / restore boundary</text>
      <text x="76" y="360" font-size="11.5" fill="#74685b">row validation · duplicate checks</text>
      <text x="76" y="375" font-size="11.5" fill="#74685b">backup round-trip · auditability</text>
    </g>

    <rect x="388" y="142" width="322" height="206" rx="18" fill="#ffffff" stroke="#cfd6db"/>
    <text x="549" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#18212b">Shared accounting service layer</text>
    <text x="549" y="202" text-anchor="middle" font-size="12" fill="#66717e">single balance / aggregation contract</text>
    <g>
      <rect x="420" y="226" width="120" height="43" rx="9" fill="#eef2f5" stroke="#d6dde1"/>
      <text x="480" y="252" text-anchor="middle" font-size="11.5" font-weight="700" fill="#234b63">Balances</text>
      <rect x="558" y="226" width="120" height="43" rx="9" fill="#edf3f0" stroke="#d6dedb"/>
      <text x="618" y="252" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4f746b">Reports</text>
      <rect x="420" y="286" width="120" height="43" rx="9" fill="#f5efe7" stroke="#e0d4c4"/>
      <text x="480" y="312" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8a6842">Budgets</text>
      <rect x="558" y="286" width="120" height="43" rx="9" fill="#f1f2f4" stroke="#d6d9de"/>
      <text x="618" y="312" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5c6672">Exports</text>
    </g>

    <g>
      <rect x="792" y="118" width="254" height="70" rx="13" fill="#fffdf9" stroke="#ddd5c8"/>
      <text x="814" y="146" font-size="14" font-weight="700" fill="#7d5d3a">Collaborative ledger</text>
      <text x="814" y="168" font-size="11.5" fill="#74685b">accounts · categories · tags · members</text>
      <text x="814" y="183" font-size="11.5" fill="#74685b">mobile-first transaction workflow</text>
    </g>
    <g>
      <rect x="792" y="214" width="254" height="70" rx="13" fill="#fffdf9" stroke="#ddd5c8"/>
      <text x="814" y="242" font-size="14" font-weight="700" fill="#7d5d3a">Audit &amp; recovery</text>
      <text x="814" y="264" font-size="11.5" fill="#74685b">soft-delete history · audit log</text>
      <text x="814" y="279" font-size="11.5" fill="#74685b">ZIP backup / restore · reproducibility</text>
    </g>
    <g>
      <rect x="792" y="310" width="254" height="70" rx="13" fill="#fffdf9" stroke="#ddd5c8"/>
      <text x="814" y="338" font-size="14" font-weight="700" fill="#7d5d3a">Deployment boundary</text>
      <text x="814" y="360" font-size="11.5" fill="#74685b">self-hosted · Tailnet-friendly</text>
      <text x="814" y="375" font-size="11.5" fill="#74685b">closed registration · explicit secrets</text>
    </g>
  </g>
  <g fill="none" stroke="#98a5aa" stroke-width="2" stroke-linecap="round">
    <path d="M304 153 H388"/><path d="M304 249 H388"/><path d="M304 345 H388"/>
    <path d="M710 177 H792"/><path d="M710 249 H792"/><path d="M710 321 H792"/>
  </g>
</svg>