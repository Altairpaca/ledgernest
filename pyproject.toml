[project]
name = "ledgernest"
version = "0.1.0"
description = "LedgerNest 账巢 - 移动端优先的多用户协作记账系统"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<3.3",
    "openpyxl>=3.1,<3.2",
    "gunicorn>=23.0,<24",
    "whitenoise>=6.7,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
addopts = "-q"
testpaths = ["tests"]
